name: Docker Build and Test

on:
  push:
    branches: [ "main", "dev", "personal/develop" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  GHCR_IMAGE: ghcr.io/zjean/oxicloud
  TEST_TAG: test/oxicloud:test

jobs:
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/personal/develop' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts correctly
        run: |
          docker run -d --name oxicloud-test \
            -e DATABASE_URL="postgres://test:test@localhost/test" \
            -p 8080:8080 \
            ${{ env.TEST_TAG }} || true

          sleep 3

          echo "=== Container status ==="
          docker ps -a --filter name=oxicloud-test
          echo "=== Container logs ==="
          docker logs oxicloud-test 2>&1 || true

          docker rm -f oxicloud-test || true

      - name: Verify image structure
        run: |
          echo "=== Image size ==="
          docker image ls ${{ env.TEST_TAG }}

          echo "=== Binary exists and is executable ==="
          docker run --rm --entrypoint sh ${{ env.TEST_TAG }} -c "test -x /usr/local/bin/oxicloud && echo 'OK: binary is executable'"

          echo "=== Static files present ==="
          docker run --rm --entrypoint sh ${{ env.TEST_TAG }} -c "ls /app/static/index.html && echo 'OK: static files present'"

          echo "=== DB schema present ==="
          docker run --rm --entrypoint sh ${{ env.TEST_TAG }} -c "ls /app/db/schema.sql && echo 'OK: schema present'"

          echo "✅ Docker build and test completed successfully"

      - name: Push to GHCR
        if: github.ref == 'refs/heads/personal/develop' && github.event_name == 'push'
        run: |
          docker tag ${{ env.TEST_TAG }} ${{ env.GHCR_IMAGE }}:dev
          docker tag ${{ env.TEST_TAG }} ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          docker push ${{ env.GHCR_IMAGE }}:dev
          docker push ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          echo "✅ Pushed to ${{ env.GHCR_IMAGE }}:dev"
